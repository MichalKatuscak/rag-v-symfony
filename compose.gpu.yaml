# Reranker na GPU NVIDIA (Windows s Docker Desktop/WSL2 nebo Linux s nvidia-container-toolkit).
# Použití: docker compose -f compose.yaml -f compose.gpu.yaml up -d reranker
# Na CPU trvá E1–E3 hodiny (260 dotazů × 30 kandidátů), na GPU minuty.
services:
  reranker:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: ["--rerank", "-hf", "gpustack/bge-reranker-v2-m3-GGUF:Q8_0", "--host", "0.0.0.0", "--port", "8080", "-c", "8192", "-ub", "8192", "-b", "8192", "-ngl", "99"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
